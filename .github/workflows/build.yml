name: CI

on:
    workflow_dispatch:
    push:
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Java 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Validate Gradle wrapper
                uses: gradle/actions/wrapper-validation@v3

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v3
                with:
                    cache-read-only: ${{ github.event_name == 'pull_request' }}

            -   name: Install NDK
                run: |
                    SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                    NDK_VERSION="$(yq .versions.ndk gradle/libs.versions.toml)"
                    echo "Installing NDK ${NDK_VERSION}"
                    echo "y" | "$SDKMANAGER" "ndk;$NDK_VERSION" --sdk_root="${ANDROID_SDK_ROOT}"

            -   name: Inject Reddit client ID
                env:
                    REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
                shell: python
                run: |
                    import os
                    from pathlib import Path

                    client_id = os.environ["REDDIT_CLIENT_ID"]
                    if client_id:
                        if any(char.isspace() or char in '\"\\' for char in client_id):
                            raise SystemExit("REDDIT_CLIENT_ID contains invalid characters")
                        Path("src/main/assets/reddit_auth.txt").write_text(
                            f'"{client_id}"\n', encoding="utf-8"
                        )
                    else:
                        print("REDDIT_CLIENT_ID is not set; configure the client ID in the app before use.")

            -   name: Run release build
                run: ./gradlew assembleRelease

            -   name: Upload release APK
                uses: actions/upload-artifact@v4
                with:
                    name: RedReader-release
                    path: build/outputs/apk/release/*.apk
                    if-no-files-found: error

            -   name: Run debug build
                run: ./gradlew assembleDebug

            -   name: Upload artifact to GitHub
                uses: actions/upload-artifact@v4
                with:
                    name: RedReader-debug.apk
                    path: build/outputs/apk/debug/RedReader-debug.apk

            -   name: Run PMD
                run: ./gradlew pmd

            -   name: Run checkstyle
                run: ./gradlew checkstyle --stacktrace --info

            -   name: Android Lint
                run: ./gradlew lint

            -   name: Unit tests
                run: ./gradlew test
